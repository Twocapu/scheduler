              "error": "#b02500",
              "inverse-on-surface": "#77a78b",
              "surface": "#dcffe7",
              "secondary-container": "#dde4e6",
              "secondary-fixed": "#dde4e6",
              "surface-container-high": "#b0f1ca",
              "on-secondary-fixed": "#394043",
              "secondary-dim": "#4a5153",
              "on-secondary-container": "#4c5355",

              "on-primary-fixed-variant": "#006a30",
              "background": "#dcffe7",

              "secondary-fixed-dim": "#cfd6d8",

              "on-background": "#023621",

              "surface-bright": "#dcffe7",
              "tertiary-fixed-dim": "#00d0ee",
              "primary-container": "#64ff92",
              "on-primary-fixed": "#004a20",
              "surface-tint": "#006a30",
              "tertiary-fixed": "#0ddfff",
              "on-secondary-fixed-variant": "#565d5f",
              "outline-variant": "#87b89b",

            },

            borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},

<style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background font-body text-on-background min-h-screen pb-12">
<!-- TopAppBar -->
<header class="bg-[#dcffe7] dark:bg-emerald-950 docked full-width top-0 z-50 sticky">
<div class="flex justify-between items-center px-6 py-6 w-full max-w-2xl mx-auto">
<div class="flex items-center gap-2 group cursor-pointer">
<h1 class="font-['Plus_Jakarta_Sans'] text-2xl font-bold tracking-tight text-[#006a30] dark:text-emerald-400">Today</h1>
<span class="material-symbols-outlined text-[#006a30] dark:text-emerald-400 text-xl transition-transform group-hover:translate-y-0.5">expand_more</span>
</div>
<div class="flex items-center gap-4">
<button class="flex items-center gap-2 bg-white dark:bg-emerald-900 px-4 py-2 rounded-full shadow-sm hover:shadow-md transition-all active:scale-95 border border-outline-variant/20">
<svg class="w-5 h-5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.66l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
<span class="text-sm font-bold text-on-surface">Login</span>
</button>
</div>
</div>
</header>
<main id="view-today" class="max-w-2xl mx-auto px-6 space-y-8 block">
<!-- Task List Area -->
<section class="space-y-6 pt-2" id="task-list">
<!-- Dynamic task list rendered by JS -->
</section>
</main>

<main id="view-manage" class="max-w-2xl mx-auto px-6 space-y-8 hidden pb-32 pt-2">
  <div class="bg-surface-container-lowest rounded-xl p-6 shadow-sm">
    <h2 class="text-xl font-bold text-on-surface mb-4">Add New Task</h2>
    <div class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-on-surface mb-1">Task Name</label>
        <input type="text" id="new-task-name" class="w-full rounded-lg border-outline-variant/30 bg-surface/50 focus:ring-primary focus:border-primary px-4 py-2" placeholder="e.g. Read 10 pages">
      </div>
      <div class="flex gap-4 items-end">
        <div class="flex-1">
          <label class="block text-sm font-medium text-on-surface mb-1">Type</label>
          <select id="new-task-type" onchange="toggleCounterInput()" class="w-full rounded-lg border-outline-variant/30 bg-surface/50 focus:ring-primary focus:border-primary px-4 py-2">
            <option value="simple">Simple (Check)</option>
            <option value="counter">Counter (e.g. 0/8)</option>
          </select>
        </div>
        <div id="counter-input-group" class="hidden w-24">
          <label class="block text-sm font-medium text-on-surface mb-1">Target</label>
          <input type="number" id="new-task-target" class="w-full rounded-lg border-outline-variant/30 bg-surface/50 focus:ring-primary focus:border-primary px-4 py-2" value="1" min="1">
        </div>
      </div>
      <button onclick="addTask()" class="w-full bg-primary text-on-primary font-bold py-3 rounded-xl hover:bg-primary-dim transition-colors mt-2">Add Task</button>
    </div>
  </div>

  <div class="space-y-4" id="manage-list">
    <!-- Manage list rendered by JS -->
  </div>
</main>

<script>
  const defaultTasks = [
    { id: 1, text: 'Begin my ADHD journey', type: 'simple', completed: false },
    { id: 2, text: 'Drink water cups', type: 'counter', current: 4, total: 8, completed: false },
    { id: 3, text: 'Create a social media plan', type: 'simple', completed: false },
    { id: 4, text: 'Brush teeth', type: 'simple', completed: true },
    { id: 5, text: 'Do homework', type: 'simple', completed: true },
    { id: 6, text: 'Call Mom', type: 'simple', completed: true },
    { id: 7, text: 'Make breakfast', type: 'simple', completed: true },
  ];

  let tasks = JSON.parse(localStorage.getItem('tasks')) || defaultTasks;
  let isManageView = false;

  function saveTasks() {
    localStorage.setItem('tasks', JSON.stringify(tasks));
  }

  function toggleManageView() {
    isManageView = !isManageView;
    const viewToday = document.getElementById('view-today');
    const viewManage = document.getElementById('view-manage');
    const fabIcon = document.getElementById('fab-icon');
    const headerTitle = document.querySelector('header h1');

    if(isManageView) {
      viewToday.classList.remove('block');
      viewToday.classList.add('hidden');
      viewManage.classList.remove('hidden');
      viewManage.classList.add('block');
      fabIcon.innerText = 'close';
      headerTitle.innerText = 'Manage Tasks';
      renderManageList();
    } else {
      viewManage.classList.remove('block');
      viewManage.classList.add('hidden');
      viewToday.classList.remove('hidden');
      viewToday.classList.add('block');
      fabIcon.innerText = 'settings';
      headerTitle.innerText = 'Today';
      renderTasks();
    }
  }

  function toggleCounterInput() {
    const type = document.getElementById('new-task-type').value;
    const counterGroup = document.getElementById('counter-input-group');
    if(type === 'counter') {
      counterGroup.classList.remove('hidden');
    } else {
      counterGroup.classList.add('hidden');
    }
  }

  function addTask() {
    const nameInput = document.getElementById('new-task-name');
    const typeInput = document.getElementById('new-task-type');
    const targetInput = document.getElementById('new-task-target');

    const text = nameInput.value.trim();
    if(!text) return alert('Please enter a task name.');

    const newTask = {
      id: Date.now(),
      text: text,
      type: typeInput.value,
      completed: false
    };

    if(newTask.type === 'counter') {
      const target = parseInt(targetInput.value);
      if(isNaN(target) || target < 1) return alert('Please enter a valid target for the counter.');
      newTask.current = 0;
      newTask.total = target;
    }

    tasks.push(newTask);
    saveTasks();
    nameInput.value = '';
    
    renderManageList();
  }

  function deleteTask(id) {
    if(confirm('Are you sure you want to delete this task?')) {
      tasks = tasks.filter(t => t.id !== id);
      saveTasks();
      renderManageList();
    }
  }

  function editTask(id) {
    const task = tasks.find(t => t.id === id);
    if(!task) return;

    const newName = prompt('Enter new task name:', task.text);
    if(newName && newName.trim() !== '') {
      task.text = newName.trim();
      
      if(task.type === 'counter') {
         const newTotalStr = prompt('Enter new total target (current is ' + task.total + '):', task.total);
         const newTotal = parseInt(newTotalStr);
         if(!isNaN(newTotal) && newTotal > 0) {
           task.total = newTotal;
           task.current = Math.min(task.current, newTotal);
           task.completed = (task.current === task.total);
         }
      }
      saveTasks();
      renderManageList();
    }
  }

  function renderManageList() {
    const container = document.getElementById('manage-list');
    let html = '';

    tasks.forEach(task => {
      const details = task.type === 'counter' ? `<span class="bg-primary/10 text-primary text-xs font-bold px-2 py-1 rounded-full ml-2">Counter ${task.current}/${task.total}</span>` : `<span class="bg-surface-variant/50 text-on-surface-variant text-xs font-bold px-2 py-1 rounded-full ml-2">Simple</span>`;
      const status = task.completed ? `<span class="text-xs font-bold text-outline uppercase tracking-widest block mt-1">Completed</span>` : `<span class="text-xs font-bold text-primary uppercase tracking-widest block mt-1">Active</span>`;
      
      html += `
        <div class="bg-surface-container-lowest rounded-xl p-5 shadow-sm flex items-center gap-4 border border-outline-variant/10">
          <div class="flex-1">
            <h3 class="text-on-surface font-semibold text-lg inline-block">${task.text}</h3>
            ${details}
            ${status}
          </div>
          <div class="flex items-center gap-2">
            <button onclick="editTask(${task.id})" class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant hover:bg-surface-variant transition-colors group">
              <span class="material-symbols-outlined text-xl transition-transform group-hover:scale-110">edit</span>
            </button>
            <button onclick="deleteTask(${task.id})" class="w-10 h-10 rounded-full bg-error-container/20 flex items-center justify-center text-error hover:bg-error-container hover:text-on-error-container transition-colors group">
              <span class="material-symbols-outlined text-xl transition-transform group-hover:scale-110">delete</span>
            </button>
          </div>
        </div>
      `;
    });

    if(tasks.length === 0) {
      html = `<div class="text-center py-8 text-on-surface-variant font-medium">No tasks found. Create one above!</div>`;
    }

    container.innerHTML = html;
  }

  // Task list functions for "Today" view
  function toggleTask(id) {
    if(isManageView) return;
    const task = tasks.find(t => t.id === id);
    if (!task) return;
    
    if (task.type === 'counter' && !task.completed) {
      task.current = task.total;
    } else if (task.type === 'counter' && task.completed) {
      task.current = 0;
    }

    task.completed = !task.completed;
    saveTasks();
    renderTasks();
  }

  function updateCounter(e, id, delta) {
    if(isManageView) return;
    e.stopPropagation();
    const task = tasks.find(t => t.id === id);
    if (task && task.type === 'counter') {
      task.current = Math.max(0, Math.min(task.total, task.current + delta));
      if (task.current === task.total) {
        task.completed = true;
      } else {
        task.completed = false;
      }
      saveTasks();
      renderTasks();
    }
  }

  function renderTasks() {
    const container = document.getElementById('task-list');
    
    const activeTasks = tasks.filter(t => !t.completed);
    const completedTasks = tasks.filter(t => t.completed);

    let html = '';

    // Active
    activeTasks.forEach(task => {
      if (task.type === 'simple') {
        html += `
          <div onclick="toggleTask(${task.id})" class="bg-surface-container-lowest rounded-xl p-6 shadow-[0px_10px_30px_rgba(2,54,33,0.03)] flex items-center gap-5 group transition-all hover:bg-white/90 cursor-pointer">
            <div class="flex-1">
              <p class="text-on-surface font-semibold text-lg">${task.text}</p>
            </div>
            <div class="w-7 h-7 rounded-full border-2 border-outline-variant/30 flex items-center justify-center bg-transparent group-hover:border-primary transition-colors"></div>
          </div>
        `;
      } else if (task.type === 'counter') {
        html += `
          <div onclick="toggleTask(${task.id})" class="bg-surface-container-lowest rounded-xl p-6 shadow-[0px_10px_30px_rgba(2,54,33,0.03)] flex items-center gap-5 group transition-all hover:bg-white/90 cursor-pointer">
            <div class="bg-primary/10 px-3 py-1 rounded-full">
              <span class="text-primary font-bold text-sm tracking-widest">${task.current}/${task.total}</span>
            </div>
            <div class="flex-1">
              <p class="text-on-surface font-semibold text-lg">${task.text}</p>
            </div>
            <div class="flex items-center gap-2">
              <button onclick="updateCounter(event, ${task.id}, -1)" class="w-8 h-8 rounded-full bg-surface-container flex items-center justify-center text-primary hover:bg-primary hover:text-on-primary transition-colors active:scale-90">
                <span class="material-symbols-outlined font-bold">remove</span>
              </button>
              <button onclick="updateCounter(event, ${task.id}, 1)" class="w-8 h-8 rounded-full bg-surface-container flex items-center justify-center text-primary hover:bg-primary hover:text-on-primary transition-colors active:scale-90">
                <span class="material-symbols-outlined font-bold">add</span>
              </button>
            </div>
          </div>
        `;
      }
    });

    if (completedTasks.length > 0) {
      if (activeTasks.length > 0) {
        html += `
          <div class="flex items-center gap-4 py-2">
            <span class="text-on-surface-variant/60 font-bold text-xs uppercase tracking-widest">Completed</span>
            <div class="h-[1px] flex-1 bg-outline-variant/20"></div>
          </div>
        `;
      } else {
        html += `
          <div class="flex items-center gap-4 py-2 mt-4">
            <span class="text-on-surface-variant/60 font-bold text-xs uppercase tracking-widest">All Tasks Completed!</span>
            <div class="h-[1px] flex-1 bg-outline-variant/20"></div>
          </div>
        `;
      }

      html += `<div class="space-y-4">`;
      
      completedTasks.forEach(task => {
        const textDisplay = task.type === 'counter' ? `${task.text} (${task.total}/${task.total})` : task.text;
        html += `
          <div onclick="toggleTask(${task.id})" class="bg-surface-variant/30 rounded-lg p-5 flex items-center gap-5 transition-all opacity-80 cursor-pointer hover:opacity-100 group">
            <div class="w-7 h-7 rounded-lg bg-primary flex items-center justify-center group-hover:scale-95 transition-transform">
              <span class="material-symbols-outlined text-surface text-lg font-bold">check</span>
            </div>
            <div class="flex-1">
              <p class="text-on-surface-variant font-medium line-through decoration-on-surface-variant/40">${textDisplay}</p>
            </div>
          </div>
        `;
      });
      html += `</div>`;
    }

    container.innerHTML = html;
  }

  // Initialize
  document.addEventListener('DOMContentLoaded', renderTasks);
</script>
<button onclick="toggleManageView()" class="fixed bottom-8 right-8 w-16 h-16 rounded-full bg-primary text-white shadow-lg flex items-center justify-center z-[100] active:scale-95 transition-all focus:outline-none focus:ring-4 focus:ring-primary/30 group"><span id="fab-icon" class="material-symbols-outlined text-3xl transition-transform duration-500 group-hover:rotate-180">settings</span></button></body></html>
