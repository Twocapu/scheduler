<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프리미엄 투두 리스트 (Premium Todo List)</title>
    <!-- React and ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #09090b;
            --glass-bg: rgba(24, 24, 27, 0.7);
            --glass-border: rgba(255, 255, 255, 0.08);
            --primary: #8b5cf6;
            --primary-hover: #7c3aed;
            --text-main: #f8fafc;
            --text-muted: #a1a1aa;
            --danger: #ef4444;
            --danger-bg: rgba(239, 68, 68, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at top right, rgba(139, 92, 246, 0.15) 0%, transparent 40%),
                              radial-gradient(circle at bottom left, rgba(59, 130, 246, 0.15) 0%, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        #root {
            width: 100%;
            max-width: 500px;
        }

        .app-container {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            margin-bottom: 32px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #a78bfa 0%, #3b82f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 15px;
        }

        .input-wrapper {
            display: flex;
            gap: 12px;
            margin-bottom: 32px;
            position: relative;
        }

        .todo-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 16px 20px;
            color: var(--text-main);
            font-size: 16px;
            transition: all 0.3s ease;
            outline: none;
        }

        .todo-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.1);
            background: rgba(255, 255, 255, 0.05);
        }

        .todo-input::placeholder {
            color: rgba(161, 161, 170, 0.5);
        }

        .add-btn {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 0 24px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .add-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(139, 92, 246, 0.3);
        }

        .add-btn:active {
            transform: translateY(0);
        }

        .todo-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .todo-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--glass-border);
            padding: 16px;
            border-radius: 16px;
            transition: all 0.3s ease;
            animation: slideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .todo-item:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.1);
            transform: scale(1.02);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .todo-content {
            display: flex;
            align-items: center;
            gap: 16px;
            flex: 1;
            cursor: pointer;
        }

        .checkbox {
            width: 24px;
            height: 24px;
            border-radius: 6px;
            border: 2px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            background: transparent;
        }

        .todo-item.completed .checkbox {
            background: var(--primary);
            border-color: var(--primary);
        }

        .check-icon {
            color: white;
            width: 14px;
            height: 14px;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.2s;
        }

        .todo-item.completed .check-icon {
            opacity: 1;
            transform: scale(1);
        }

        .todo-text {
            font-size: 16px;
            transition: all 0.3s;
            color: var(--text-main);
        }

        .todo-item.completed .todo-text {
            color: var(--text-muted);
            text-decoration: line-through;
            opacity: 0.6;
        }

        .delete-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            opacity: 0;
        }

        .todo-item:hover .delete-btn {
            opacity: 1;
        }

        .delete-btn:hover {
            background: var(--danger-bg);
            color: var(--danger);
        }

        .empty-state {
            text-align: center;
            padding: 40px 0 20px;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .empty-state svg {
            width: 64px;
            height: 64px;
            opacity: 0.2;
        }

        /* 반응형 */
        @media (max-width: 480px) {
            .app-container {
                padding: 24px;
            }
            .header h1 {
                font-size: 28px;
            }
            .todo-input, .add-btn {
                font-size: 15px;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const CheckIcon = () => (
            <svg className="check-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
        );

        const TrashIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M3 6h18"></path>
                <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
                <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
                <line x1="10" y1="11" x2="10" y2="17"></line>
                <line x1="14" y1="11" x2="14" y2="17"></line>
            </svg>
        );

        const EmptyIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                <polyline points="22 4 12 14.01 9 11.01"></polyline>
            </svg>
        );

        const TodoApp = () => {
            const [todos, setTodos] = useState(() => {
                const saved = localStorage.getItem('premium-todos');
                if (saved) return JSON.parse(saved);
                return [
                    { id: 1, text: '멋진 UI의 투두 리스트(Todo List) 만들기 ✨', completed: true },
                    { id: 2, text: '리액트(React)로 상태 관리 구현하기', completed: false }
                ];
            });
            const [input, setInput] = useState('');
            const inputRef = useRef(null);

            useEffect(() => {
                localStorage.setItem('premium-todos', JSON.stringify(todos));
            }, [todos]);

            const addTodo = (e) => {
                e.preventDefault();
                if (!input.trim()) return;
                
                const newTodo = {
                    id: Date.now(),
                    text: input.trim(),
                    completed: false
                };
                
                setTodos([newTodo, ...todos]);
                setInput('');
                inputRef.current?.focus();
            };

            const toggleTodo = (id) => {
                setTodos(todos.map(todo => 
                    todo.id === id ? { ...todo, completed: !todo.completed } : todo
                ));
            };

            const deleteTodo = (id, e) => {
                e.stopPropagation();
                setTodos(todos.filter(todo => todo.id !== id));
            };

            const pendingCount = todos.filter(t => !t.completed).length;

            return (
                <div className="app-container">
                    <header className="header">
                        <h1>Task Master</h1>
                        <p>{pendingCount > 0 ? `앞으로 ${pendingCount}개의 목표가 남았습니다.` : '모든 목표를 달성했습니다! 🎉'}</p>
                    </header>

                    <form onSubmit={addTodo} className="input-wrapper">
                        <input
                            ref={inputRef}
                            type="text"
                            className="todo-input"
                            placeholder="새로운 할 일(Task)을 입력하세요..."
                            value={input}
                            onChange={(e) => setInput(e.target.value)}
                        />
                        <button type="submit" className="add-btn">추가(Add)</button>
                    </form>

                    {todos.length === 0 ? (
                        <div className="empty-state">
                            <EmptyIcon />
                            <p>새로운 할 일(Task)을 추가해보세요!</p>
                        </div>
                    ) : (
                        <ul className="todo-list">
                            {todos.map(todo => (
                                <li 
                                    key={todo.id} 
                                    className={`todo-item ${todo.completed ? 'completed' : ''}`}
                                    onClick={() => toggleTodo(todo.id)}
                                >
                                    <div className="todo-content">
                                        <div className="checkbox">
                                            <CheckIcon />
                                        </div>
                                        <span className="todo-text">{todo.text}</span>
                                    </div>
                                    <button 
                                        className="delete-btn"
                                        onClick={(e) => deleteTodo(todo.id, e)}
                                        aria-label="Delete"
                                    >
                                        <TrashIcon />
                                    </button>
                                </li>
                            ))}
                        </ul>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<TodoApp />);
    </script>
</body>
</html>
